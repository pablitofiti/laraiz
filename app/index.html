<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>La raíz</title>
<meta name="theme-color" content="#15181A" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="La raíz" />
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap');
:root{
  --papel:#E9EBE6; --papelAlt:#F3F4F0; --tinta:#15181A; --grafito:#616A6E; --linea:#C2C8C0; --fina:#D6DAD3;
  --ocre:#9C6B2F; --ocreClaro:#E8D9BF; --amarillo:#F2D557; --amarilloClaro:#FBF0BF; --verde:#5E8C4A; --verdeClaro:#D9E6CF;
  --rojo:#A5382C; --gris:#B9BFB9;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{
  background:var(--papel); color:var(--tinta);
  font-family:'IBM Plex Sans','Helvetica Neue',sans-serif; font-size:14px; line-height:1.45;
  background-image:linear-gradient(var(--fina) 1px,transparent 1px),linear-gradient(90deg,var(--fina) 1px,transparent 1px);
  background-size:48px 48px,48px 48px; -webkit-tap-highlight-color:transparent;
}
.wrap{ max-width:1280px; margin:0 auto; padding:14px 12px 120px; }
/* cajetín */
.cajetin{ display:grid; grid-template-columns:1fr auto; border:1.5px solid var(--tinta); background:var(--papelAlt); margin-bottom:14px; }
.cajetin .izq{ padding:10px 14px; border-right:1.5px solid var(--tinta); }
.cajetin .der{ padding:10px 14px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--grafito); display:flex; flex-direction:column; justify-content:center; gap:2px; min-width:200px; }
.cajetin h1{ margin:0; font-family:'IBM Plex Sans Condensed',sans-serif; font-weight:700; font-size:22px; letter-spacing:.04em; text-transform:uppercase; }
.cajetin .lema{ margin:2px 0 0; color:var(--grafito); font-size:12px; font-style:italic; }
.estado{ display:inline-flex; align-items:center; gap:6px; }
.estado .pto{ width:8px; height:8px; border-radius:50%; background:var(--gris); }
.estado .pto.ok{ background:var(--verde); } .estado .pto.err{ background:var(--rojo); } .estado .pto.sync{ background:var(--amarillo); }
/* barra */
.barra{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.btn{ font:inherit; font-size:12px; letter-spacing:.03em; text-transform:uppercase; padding:6px 10px; border:1.2px solid var(--tinta); background:var(--papelAlt); color:var(--tinta); cursor:pointer; }
.btn:hover{ background:#fff; } .btn.sec{ border-color:var(--grafito); color:var(--grafito); } .btn.act{ background:var(--tinta); color:var(--papel); }
.btn:disabled{ opacity:.4; cursor:default; }
/* árbol */
.objetivo{ display:grid; grid-template-columns:1fr; gap:8px; justify-items:center; margin-bottom:12px; }
.tablero{ display:flex; gap:12px; align-items:flex-start; overflow-x:auto; padding-bottom:12px; scroll-snap-type:x proximity; }
.tablero > *{ scroll-snap-align:start; }
.raiz{ flex:0 0 272px; width:272px; }
.raiz.arrastrando{ opacity:.4; }
.raiz.sobre{ outline:2px dashed var(--ocre); outline-offset:3px; }
.raiz h2 .titulo-raiz{ cursor:text; flex:1; }
.raiz h2 input{ font:inherit; font-family:'IBM Plex Sans Condensed',sans-serif; font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:.05em; width:100%; border:1px solid var(--ocre); background:#fff; padding:2px 4px; }
.raiz h2 .asa{ cursor:grab; color:var(--grafito); font-size:12px; padding:0 4px; }
.raiz h2 .asa:active{ cursor:grabbing; }
.raiz h2 .mas{ font:inherit; font-size:12px; border:0; background:none; color:var(--grafito); cursor:pointer; padding:0 4px; }
.cuadro.arrastrando{ opacity:.4; }
.cuadro.sobre-antes{ box-shadow:0 -3px 0 0 var(--ocre); }
.cuadro.sobre-despues{ box-shadow:0 3px 0 0 var(--ocre); }
.cuadros.sobre{ background:var(--ocreClaro); }
.nuevaRaiz{ flex:0 0 220px; border:1.2px dashed var(--gris); background:transparent; color:var(--grafito); padding:10px; font:inherit; font-size:12px; text-transform:uppercase; letter-spacing:.03em; cursor:pointer; align-self:flex-start; }
.nuevaRaiz:hover{ border-color:var(--tinta); color:var(--tinta); }
.menuRaiz{ position:absolute; background:var(--papelAlt); border:1.2px solid var(--tinta); box-shadow:4px 4px 0 rgba(0,0,0,.12); z-index:25; display:flex; flex-direction:column; min-width:180px; }
.menuRaiz button{ font:inherit; font-size:12px; text-align:left; padding:7px 10px; border:0; border-bottom:1px solid var(--linea); background:none; cursor:pointer; }
.menuRaiz button:hover{ background:#fff; } .menuRaiz button.rojo{ color:var(--rojo); }
.copa{ border:1.5px solid var(--tinta); background:var(--papelAlt); padding:10px 18px; text-align:center; font-family:'IBM Plex Sans Condensed',sans-serif; font-weight:600; font-size:16px; text-transform:uppercase; letter-spacing:.05em; max-width:520px; }
.tronco{ border:1.2px solid var(--grafito); color:var(--grafito); padding:6px 14px; font-size:12px; text-align:center; max-width:460px; font-family:'IBM Plex Mono',monospace; }
.raiz{ border:1.2px solid var(--tinta); background:var(--papelAlt); }
.raiz h2{ margin:0; padding:8px 10px; font-family:'IBM Plex Sans Condensed',sans-serif; font-size:14px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; border-bottom:1.2px solid var(--tinta); display:flex; justify-content:space-between; align-items:center; }
.raiz h2 small{ font-family:'IBM Plex Mono',monospace; font-weight:400; font-size:10px; color:var(--grafito); }
.cuadros{ padding:8px; display:flex; flex-direction:column; gap:8px; }
.cuadro{ border:1.2px solid var(--tinta); padding:8px 10px; cursor:pointer; position:relative; background:#fff; min-height:54px; }
.cuadro .t{ font-size:13px; line-height:1.3; }
.cuadro .m{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafito); margin-top:4px; display:flex; gap:10px; }
.cuadro.bloqueado{ background:repeating-linear-gradient(45deg,#e4e6e1 0 6px,#eceee9 6px 12px); color:var(--grafito); border-color:var(--gris); border-style:dashed; }
.cuadro.disponible{ background:#fff; }
.cuadro.activo{ background:var(--amarilloClaro); border-width:2px; }
.cuadro.activo::before{ content:""; position:absolute; left:-1px; top:-1px; bottom:-1px; width:6px; background:var(--amarillo); }
.cuadro.hecho{ background:var(--verdeClaro); border-color:var(--verde); }
.cuadro.hecho .t{ text-decoration:line-through; color:var(--grafito); }
.cuadro.sel{ outline:2px solid var(--ocre); outline-offset:2px; }
.cuadro .hijos{ position:absolute; right:8px; top:6px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafito); }
/* panel */
.panel{ position:fixed; right:0; top:0; bottom:0; width:min(460px,100%); background:var(--papelAlt); border-left:1.5px solid var(--tinta); box-shadow:-8px 0 24px rgba(0,0,0,.12); transform:translateX(105%); transition:transform .18s; overflow:auto; z-index:20; }
.panel.open{ transform:none; }
.panel .cab{ padding:12px 14px; border-bottom:1.2px solid var(--tinta); display:flex; justify-content:space-between; align-items:flex-start; gap:8px; position:sticky; top:0; background:var(--papelAlt); }
.panel .cab h3{ margin:0; font-size:15px; font-family:'IBM Plex Sans Condensed',sans-serif; font-weight:600; }
.panel .cab .ruta{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafito); }
.panel .cuerpo{ padding:12px 14px; display:flex; flex-direction:column; gap:14px; }
.campo label{ display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--grafito); margin-bottom:3px; }
.campo input,.campo textarea{ width:100%; font:inherit; font-size:13px; padding:6px 8px; border:1.2px solid var(--linea); background:#fff; color:var(--tinta); }
.campo textarea{ min-height:64px; resize:vertical; }
.chip{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; padding:2px 6px; border:1px solid var(--tinta); }
.chip.activo{ background:var(--amarillo); } .chip.hecho{ background:var(--verde); color:#fff; border-color:var(--verde); } .chip.bloqueado{ color:var(--grafito); border-color:var(--gris); }
.acciones{ display:flex; gap:6px; flex-wrap:wrap; }
.lista{ display:flex; flex-direction:column; gap:6px; }
.paso{ border:1px solid var(--linea); background:#fff; padding:6px 8px; display:flex; gap:8px; align-items:flex-start; cursor:pointer; }
.paso.activo{ background:var(--amarilloClaro); border-color:var(--tinta); }
.paso.hecho{ background:var(--verdeClaro); } .paso.hecho .t{ text-decoration:line-through; color:var(--grafito); }
.paso.bloqueado{ color:var(--grafito); border-style:dashed; }
.paso .mini{ display:flex; gap:2px; margin-left:auto; }
.paso .mini button{ font:inherit; font-size:11px; line-height:1; padding:3px 5px; border:1px solid var(--linea); background:var(--papelAlt); color:var(--grafito); cursor:pointer; }
.paso .mini button:hover{ border-color:var(--tinta); color:var(--tinta); }
.paso .n{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafito); min-width:18px; }
.nota{ border-left:3px solid var(--ocre); padding:4px 8px; background:#fff; font-size:13px; }
.nota .f{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafito); }
.velo{ position:fixed; inset:0; background:rgba(21,24,26,.25); z-index:15; display:none; }
.velo.open{ display:block; }
/* editable */
.ed{ cursor:text; border-bottom:1px dashed transparent; }
.ed:hover{ border-bottom-color:var(--ocre); }
input.edIn{ font:inherit; color:inherit; background:#fff; border:1px solid var(--ocre); padding:1px 4px; width:100%; max-width:100%; }
/* atención */
.atencion{ grid-column:1/-1; display:grid; grid-template-columns:repeat(3,1fr); gap:0; border:1.5px solid var(--tinta); background:var(--papelAlt); }
.atencion > div{ padding:8px 10px; border-right:1.2px solid var(--tinta); min-height:90px; }
.atencion > div:last-child{ border-right:0; }
.atencion h4{ margin:0 0 6px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--grafito); display:flex; justify-content:space-between; }
.atencion .it{ font-size:12px; padding:4px 6px; margin-bottom:4px; background:#fff; border-left:3px solid var(--grafito); cursor:pointer; }
.atencion .imp .it{ border-color:var(--amarillo); } .atencion .ven .it{ border-color:var(--rojo); } .atencion .pro .it{ border-color:var(--ocre); }
.atencion .it small{ display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafito); }
.atencion .nada{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--gris); }
@media (max-width:640px){ .atencion{ grid-template-columns:1fr; } .atencion > div{ border-right:0; border-bottom:1.2px solid var(--tinta); } .atencion > div:last-child{ border-bottom:0; } }
.estrella{ font:inherit; border:0; background:none; cursor:pointer; font-size:15px; color:var(--gris); padding:0 4px; line-height:1; }
.estrella.on{ color:#C9A227; }
/* bandeja */
.bandeja .item{ display:flex; gap:8px; align-items:flex-start; background:#fff; border:1px solid var(--linea); padding:6px 8px; }
.bandeja .item .tx{ flex:1; font-size:13px; }
.bandeja .item .f{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafito); }
.bandeja .item.imp{ border-left:3px solid #C9A227; }
.bandeja details{ margin-top:10px; } .bandeja summary{ cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--grafito); text-transform:uppercase; letter-spacing:.06em; }
.opciones{ display:grid; grid-template-columns:1fr; gap:6px; }
.opciones .op{ border:1.2px solid var(--tinta); background:#fff; padding:8px 10px; cursor:pointer; display:flex; gap:8px; align-items:center; }
.opciones .op:hover{ background:var(--amarilloClaro); }
.opciones .op b{ font-family:'IBM Plex Mono',monospace; font-size:11px; min-width:90px; text-transform:uppercase; letter-spacing:.04em; }
.opciones select,.opciones input[type=date]{ font:inherit; font-size:12px; padding:3px 6px; border:1px solid var(--linea); flex:1; min-width:0; max-width:62%; }
/* revisión */
.rev{ display:flex; flex-direction:column; gap:14px; }
.rev section{ border:1.2px solid var(--tinta); background:var(--papelAlt); }
.rev section h2{ margin:0; padding:8px 10px; font-family:'IBM Plex Sans Condensed',sans-serif; font-size:14px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; border-bottom:1.2px solid var(--tinta); display:flex; justify-content:space-between; }
.rev section h2 small{ font-family:'IBM Plex Mono',monospace; font-weight:400; font-size:10px; color:var(--grafito); }
.rev .cuerpo{ padding:10px; display:flex; flex-direction:column; gap:6px; }
/* diario */
.diario{ margin-top:18px; border:1.2px solid var(--tinta); background:var(--papelAlt); }
.diario h2{ margin:0; padding:8px 10px; font-family:'IBM Plex Sans Condensed',sans-serif; font-size:14px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; border-bottom:1.2px solid var(--tinta); }
.diario .cuerpo{ padding:10px; display:flex; flex-direction:column; gap:8px; }
.diario .alta{ display:flex; gap:6px; }
.diario .alta input{ flex:1; font:inherit; font-size:13px; padding:6px 8px; border:1.2px solid var(--linea); background:#fff; }
.aviso{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--grafito); padding:6px 0; }
.toast{ position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--tinta); color:var(--papel); padding:8px 14px; font-size:12px; font-family:'IBM Plex Mono',monospace; z-index:30; display:none; }
/* vistas */
.vista{ display:none; } .vista.on{ display:block; }
.nav{ display:flex; gap:6px; align-items:center; margin-bottom:12px; }
.nav .titulo{ font-family:'IBM Plex Sans Condensed',sans-serif; font-weight:700; font-size:16px; letter-spacing:.05em; text-transform:uppercase; margin-left:6px; }
.indice{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
.lamina{ border:1.5px solid var(--tinta); background:var(--papelAlt); min-height:150px; padding:12px 14px; cursor:pointer; position:relative; display:flex; flex-direction:column; }
.lamina:hover{ background:#fff; }
.lamina .num{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafito); letter-spacing:.08em; }
.lamina h3{ margin:4px 0 6px; font-family:'IBM Plex Sans Condensed',sans-serif; font-weight:700; font-size:20px; letter-spacing:.04em; text-transform:uppercase; }
.lamina p{ margin:0; color:var(--grafito); font-size:12px; }
.lamina .pie{ margin-top:auto; padding-top:8px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--grafito); border-top:1px solid var(--linea); }
.lamina.ahora{ grid-column:1/-1; cursor:default; }
.lamina.ahora:hover{ background:var(--papelAlt); }
.ahoraLista{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:8px; margin-top:6px; }
.ahoraItem{ border:1.2px solid var(--tinta); background:var(--amarilloClaro); padding:8px 10px; cursor:pointer; position:relative; }
.ahoraItem::before{ content:""; position:absolute; left:-1px; top:-1px; bottom:-1px; width:6px; background:var(--amarillo); }
.ahoraItem .r{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafito); text-transform:uppercase; letter-spacing:.06em; }
.ahoraItem .t{ font-size:13px; margin-top:2px; }
.ahoraItem .h{ font-size:11px; color:var(--grafito); margin-top:3px; font-style:italic; }
/* calendario */
.cal{ border:1.5px solid var(--tinta); background:var(--papelAlt); }
.cal .cab{ display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-bottom:1.2px solid var(--tinta); }
.cal .cab h3{ margin:0; font-family:'IBM Plex Sans Condensed',sans-serif; font-weight:700; font-size:16px; letter-spacing:.05em; text-transform:uppercase; }
.cal .cab .num{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafito); letter-spacing:.08em; margin-right:8px; }
.cal .dias{ display:grid; grid-template-columns:repeat(7,1fr); }
.cal .dn{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafito); text-align:center; padding:4px 0; border-bottom:1px solid var(--linea); text-transform:uppercase; }
.cal .d{ min-height:64px; border-right:1px solid var(--fina); border-bottom:1px solid var(--fina); padding:3px 4px; font-size:11px; cursor:pointer; position:relative; background:#fff; }
.cal .d:nth-child(7n){ border-right:0; }
.cal .d.fuera{ background:transparent; color:var(--gris); }
.cal .d.hoy .n{ background:var(--tinta); color:var(--papel); }
.cal .d .n{ font-family:'IBM Plex Mono',monospace; font-size:10px; display:inline-block; padding:1px 4px; }
.cal .d:hover{ background:var(--papelAlt); }
.cal .d.sel{ outline:2px solid var(--ocre); outline-offset:-2px; }
.marca{ display:block; font-size:10px; line-height:1.25; margin-top:2px; padding:1px 4px; border-left:3px solid var(--grafito); background:var(--papelAlt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.marca.plazo{ border-color:var(--amarillo); background:var(--amarilloClaro); }
.marca.vencido{ border-color:var(--rojo); background:#F3DAD6; }
.marca.hecho{ border-color:var(--verde); background:var(--verdeClaro); }
.marca.inicio{ border-color:var(--ocre); background:var(--ocreClaro); }
.marca.evento{ border-color:var(--tinta); background:#fff; }
.cal.mini .d{ min-height:48px; }
.cal.mini .marca{ font-size:9px; padding:0 3px; }
.cal.mini{ cursor:pointer; }
.leyenda{ display:flex; gap:10px; flex-wrap:wrap; padding:6px 10px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--grafito); border-top:1px solid var(--linea); }
.leyenda span::before{ content:""; display:inline-block; width:8px; height:8px; margin-right:4px; vertical-align:middle; }
.leyenda .lp::before{ background:var(--amarillo); } .leyenda .lv::before{ background:var(--rojo); } .leyenda .lh::before{ background:var(--verde); } .leyenda .li::before{ background:var(--ocre); } .leyenda .le::before{ background:var(--tinta); }
@media (max-width:640px){ .cal .d{ min-height:52px; padding:2px; } .marca{ font-size:0; height:5px; padding:0; border-left:0; margin-top:3px; } .cal.mini .marca{ font-size:0; height:4px; } }
.lamina.vacia{ border-style:dashed; border-color:var(--gris); color:var(--grafito); cursor:default; justify-content:center; align-items:center; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11px; }
.lamina.vacia:hover{ background:var(--papelAlt); }
@media (max-width:640px){ .cajetin{ grid-template-columns:1fr; } .cajetin .izq{ border-right:0; border-bottom:1.5px solid var(--tinta); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="cajetin">
    <div class="izq">
      <h1 id="titulo">La raíz</h1>
      <p class="lema" id="lema"></p>
    </div>
    <div class="der">
      <div class="estado"><span class="pto" id="ptoDatos"></span><span id="txtDatos">sin datos</span></div>
      <div id="txtActualizado">—</div>
      <div id="txtArchivo">raiz.json</div>
      <div id="txtVersion">v1.5</div>
    </div>
  </div>

  <!-- INICIO -->
  <section class="vista" id="vInicio">
    <div class="indice" id="indice"></div>
  </section>

  <!-- ÁRBOL -->
  <section class="vista" id="vArbol">
  <div class="nav"><button class="btn sec" data-ir="inicio">◀ Inicio</button><span class="titulo">El árbol</span></div>
  <div class="barra">
    <button class="btn" id="bArchivo">Vincular raiz.json</button>
    <button class="btn" id="bDropbox">Conectar Dropbox</button>
    <button class="btn sec" id="bRecargar">Recargar</button>
    <button class="btn sec" id="bDescargar">Descargar copia</button>
    <span class="aviso" id="avisoModo"></span>
  </div>

  <div class="arbol" id="arbol"></div>
  </section>

  <!-- CALENDARIO -->
  <section class="vista" id="vCalendario">
  <div class="nav"><button class="btn sec" data-ir="inicio">◀ Inicio</button><span class="titulo">Calendario</span></div>
  <div id="calGrande"></div>
  </section>

  <!-- BANDEJA -->
  <section class="vista" id="vBandeja">
  <div class="nav"><button class="btn sec" data-ir="inicio">◀ Inicio</button><span class="titulo" id="tBandeja">Bandeja</span></div>
  <div class="diario bandeja">
    <div class="cuerpo">
      <div class="alta"><input id="bandejaTxt" placeholder="Captura: una idea, una llamada, algo que mirar…" /><button class="btn" id="bCapturar">Capturar</button></div>
      <div class="lista" id="bandejaLista"></div>

      <details><summary>Archivadas (<span id="nArch">0</span>)</summary><div class="lista" id="bandejaArchLista" style="margin-top:6px"></div></details>

<div class="velo" id="velo"></div>
<aside class="panel" id="panel">

<script src="./config.js"></script>
<script>
/* ============================================================
   LA RAÍZ · app de objetivos en árbol de habilidades
   Datos: un único raiz.json. Reglas:
   - estados: bloqueado | disponible | activo | hecho
   - un solo activo por padre
   - al marcar hecho, el siguiente 'orden' del mismo padre pasa a disponible
   - solo los nodos activos se desglosan (tienen hijos)
   ============================================================ */
const CFG = window.RAIZ_CONFIG || {};
const RUTA_DROPBOX = CFG.rutaArchivo || "/00_APP TD/raiz.json";
const LS_DATOS = "raiz.datos", LS_RT = "raiz.dbx.refresh", LS_VERIF = "raiz.dbx.verifier";

let datos = null;          // el documento
let selId = null;          // nodo abierto en el panel
let fileHandle = null;     // File System Access
let modo = "local";        // local | archivo | dropbox
let guardarTimer = null;

const $ = (s) => document.querySelector(s);
const hoy = () => new Date().toISOString().slice(0,10);
const ahora = () => new Date().toISOString();
function toast(m){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display="none",2200); }
function setEstado(cls, txt){ const p=$("#ptoDatos"); p.className="pto "+cls; $("#txtDatos").textContent=txt; }

/* ---------- modelo ---------- */
const nodo = (id) => datos.nodos.find(n => n.id === id);
const hijos = (id) => datos.nodos.filter(n => n.padre === id).sort((a,b)=>(a.orden||0)-(b.orden||0));
const raices = () => hijos("arbol");
function ruta(id){ const r=[]; let n=nodo(id); while(n){ r.unshift(n.titulo); n = n.padre ? nodo(n.padre) : null; } return r; }

function activar(id){
  const n = nodo(id); if(!n) return;
  if(n.estado === "bloqueado"){ toast("Está bloqueado: termina antes el anterior"); return; }
  const otro = hijos(n.padre).find(h => h.estado === "activo" && h.id !== id);
  if(otro){ toast("Ya hay uno activo en esta raíz: " + otro.titulo); return; }
  n.estado = "activo"; n.activado = hoy();
  // el padre también pasa a activo
  if(n.padre && nodo(n.padre) && nodo(n.padre).estado !== "activo" && nodo(n.padre).estado !== "hecho"){ nodo(n.padre).estado = "activo"; }
  guardar(); render();
}
function marcarHecho(id){
  const n = nodo(id); if(!n) return;
  const pendientes = hijos(id).filter(h => h.estado !== "hecho");
  if(pendientes.length && !confirm("Quedan " + pendientes.length + " pasos sin hacer. ¿Marcar hecho igualmente?")) return;
  n.estado = "hecho"; n.cerrado = hoy();
  // desbloquear el siguiente hermano
  const hs = hijos(n.padre); const i = hs.findIndex(h => h.id === id);
  const sig = hs.slice(i+1).find(h => h.estado === "bloqueado");
  if(sig){
    // un paso siguiente se activa solo; un cuadro siguiente queda disponible (lo activas tú)
    sig.estado = (n.tipo === "paso") ? "activo" : "disponible";
    if(sig.estado === "activo") sig.activado = hoy();
    toast((sig.estado === "activo" ? "Siguiente paso: " : "Desbloqueado: ") + sig.titulo);
  }
  // si todos los hermanos están hechos, el padre queda disponible para cerrarse
  guardar(); render();
}
function reabrir(id){ const n=nodo(id); n.estado="activo"; delete n.cerrado; guardar(); render(); }
function nuevoHijo(padreId, titulo){
  const p = nodo(padreId);
  if(p.estado !== "activo"){ toast("Solo se desglosa un nodo activo"); return; }
  const hs = hijos(padreId);
  const base = padreId + "." + titulo.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,24);
  let id = base, k = 2; while(nodo(id)) id = base + "-" + (k++);
  const tipo = p.tipo === "raiz" ? "cuadro" : "paso";
  const estado = hs.length === 0 ? "activo" : (hs.every(h=>h.estado==="hecho") ? "disponible" : "bloqueado");
  datos.nodos.push({ id, padre: padreId, tipo, titulo, estado, orden: hs.length + 1, creado: hoy() });
  guardar(); render();
}
function mover(id, delta){
  const n = nodo(id); const hs = hijos(n.padre); const i = hs.findIndex(h => h.id === id); const j = i + delta;
  if(j < 0 || j >= hs.length) return;
  hs.forEach((h,k) => h.orden = k + 1);
  const o = hs[i].orden; hs[i].orden = hs[j].orden; hs[j].orden = o;
  guardar(); render();
}
function eliminar(id){
  const n = nodo(id); const desc = descendientes(id);
  const msg = "¿Eliminar «" + n.titulo + "»" + (desc.length ? " y sus " + desc.length + " hijos" : "") + "? No se puede deshacer.";
  if(!confirm(msg)) return;
  const quitar = new Set([id, ...desc.map(d => d.id)]);
  datos.nodos = datos.nodos.filter(x => !quitar.has(x.id));
  hijos(n.padre).forEach((h,k) => h.orden = k + 1);
  if(selId === id) selId = n.padre && nodo(n.padre) && nodo(n.padre).tipo !== "objetivo" ? n.padre : null;
  if(!selId) { $("#panel").classList.remove("open"); $("#velo").classList.remove("open"); }
  guardar(); render();
}
function descendientes(id){ const out = []; const pila = [id]; while(pila.length){ const p = pila.pop(); for(const h of datos.nodos.filter(x => x.padre === p)){ out.push(h); pila.push(h.id); } } return out; }
function nuevaRaiz(titulo){
  const rs = raices(); const base = "raiz-" + titulo.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,20);
  let id = base, k = 2; while(nodo(id)) id = base + "-" + (k++);
  datos.nodos.push({ id, padre: "arbol", tipo: "raiz", titulo, estado: "disponible", orden: rs.length + 1, creado: hoy() });
  guardar(); render();
}
function renombrar(id, titulo){ const n = nodo(id); if(titulo && titulo !== n.titulo){ n.titulo = titulo; guardar(); } render(); }
function moverA(id, nuevoPadre, indice){
  // mueve un nodo a otro padre (o al mismo) en la posición indice (0-based)
  const n = nodo(id); if(!n || id === nuevoPadre) return;
  if(descendientes(id).some(d => d.id === nuevoPadre)) return;
  const origen = n.padre;
  const destino = hijos(nuevoPadre).filter(h => h.id !== id);
  destino.splice(Math.max(0, Math.min(indice, destino.length)), 0, n);
  n.padre = nuevoPadre;
  destino.forEach((h,k) => h.orden = k + 1);
  if(origen !== nuevoPadre) hijos(origen).forEach((h,k) => h.orden = k + 1);
  guardar(); render();
}
function addNota(id, texto){ const n=nodo(id); (n.notas = n.notas || []).unshift({ fecha: hoy(), texto }); n.tocado = hoy(); guardar(); render(); }
/* ---------- textos editables ---------- */
const TEXTOS_DEF = { ahora:"Lo que toca", arbol_t:"El árbol", arbol_d:"Objetivo, raíces, cuadros y pasos. Lo que se desbloquea al terminar lo anterior.", bandeja_t:"Bandeja", bandeja_d:"Captura todo aquí y luego decide dónde va. Vacía es la meta.", revision_t:"Revisión semanal", revision_d:"Una vez por semana: bandeja, pasos parados, plazos y una línea." };
function texto(k){ return (datos.textos && datos.textos[k]) || TEXTOS_DEF[k] || ""; }
function setTexto(k, v){ datos.textos = datos.textos || {}; if(v) datos.textos[k] = v; else delete datos.textos[k]; guardar(); render(); }
function editable(el, valor, onOk, multi){
  // convierte un elemento en editable con un clic
  el.classList.add("ed"); el.title = "Doble clic para editar";
  el.ondblclick = (e) => {
    e.stopPropagation(); e.preventDefault();
    const inp = document.createElement("input"); inp.className = "edIn"; inp.value = valor;
    el.replaceWith(inp); inp.focus(); inp.select();
    let fin = false; const ok = () => { if(fin) return; fin = true; onOk(inp.value.trim()); };
    inp.onblur = ok; inp.onkeydown = (ev) => { if(ev.key==="Enter") ok(); if(ev.key==="Escape"){ fin = true; render(); } };
    inp.onclick = (ev) => ev.stopPropagation();
  };
}
/* ---------- bandeja (GTD) ---------- */
function migrar(){
  // diario antiguo -> bandeja pendiente (una sola vez)
  if(datos.diario && datos.diario.length){
    datos.bandeja = datos.bandeja || [];
    for(const d of datos.diario) datos.bandeja.push({ id: "b" + Math.random().toString(36).slice(2,8), fecha: d.fecha, texto: d.texto, estado: "pendiente" });
    delete datos.diario; guardar();
  }
  datos.bandeja = datos.bandeja || []; datos.revisiones = datos.revisiones || [];
}
function capturar(texto){ datos.bandeja.unshift({ id: "b" + Date.now().toString(36), fecha: hoy(), texto, estado: "pendiente" }); guardar(); render(); }
function itemBandeja(id){ return datos.bandeja.find(b => b.id === id); }
function procesar(id, accion, arg){
  const b = itemBandeja(id); if(!b) return;
  if(accion === "paso" && arg){ const p = nodo(arg); if(p.estado !== "activo") p.estado = "activo"; nuevoHijoSilencioso(arg, b.texto, b.importante); b.estado = "archivado"; b.destino = "paso en " + p.titulo; }
  if(accion === "cuadro" && arg){ const r = nodo(arg); const hs = hijos(arg); const n = nuevoHijoSilencioso(arg, b.texto, b.importante, true); b.estado = "archivado"; b.destino = "cuadro en " + r.titulo; }
  if(accion === "calendario" && arg){ (datos.eventos = datos.eventos || []).push({ id: "ev" + Date.now().toString(36), fecha: arg, texto: b.texto }); b.estado = "archivado"; b.destino = "calendario " + arg; }
  if(accion === "nota" && arg){ const n = nodo(arg); (n.notas = n.notas || []).unshift({ fecha: hoy(), texto: b.texto }); b.estado = "archivado"; b.destino = "nota en " + n.titulo; }
  if(accion === "algundia") b.estado = "algundia";
  if(accion === "archivar"){ b.estado = "archivado"; b.destino = "archivado"; }
  if(accion === "pendiente") b.estado = "pendiente";
  if(accion === "borrar") datos.bandeja = datos.bandeja.filter(x => x.id !== id);
  b.procesado = hoy(); guardar(); cerrar();
}
function nuevoHijoSilencioso(padreId, titulo, importante, comoCuadro){
  const p = nodo(padreId); const hs = hijos(padreId);
  const base = padreId + "." + titulo.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,24);
  let id = base, k = 2; while(nodo(id)) id = base + "-" + (k++);
  const tipo = (p.tipo === "raiz" || comoCuadro) ? "cuadro" : "paso";
  const estado = hs.length === 0 ? (tipo === "paso" ? "activo" : "disponible") : (hs.every(h=>h.estado==="hecho") ? "disponible" : "bloqueado");
  const n = { id, padre: padreId, tipo, titulo, estado, orden: hs.length + 1, creado: hoy() }; if(importante) n.importante = true;
  datos.nodos.push(n); return n;
}
function toggleImportante(id, esBandeja){
  const x = esBandeja ? itemBandeja(id) : nodo(id); if(!x) return;
  if(x.importante) delete x.importante; else x.importante = true;
  guardar(); render();
}
function abrirBandeja(id){
  const b = itemBandeja(id); if(!b) return; selId = null;
  $("#panel").classList.add("open"); $("#velo").classList.add("open");
  $("#pRuta").textContent = "bandeja · " + b.fecha + (b.destino ? " · " + b.destino : "");
  $("#pTitulo").textContent = b.texto;
  const activos = datos.nodos.filter(n => n.tipo === "cuadro" && n.estado === "activo");
  const cuadros = datos.nodos.filter(n => (n.tipo === "cuadro" || n.tipo === "paso") && n.estado !== "hecho");
  const rs = raices();
  const sel = (arr, id) => `<select id="${id}">${arr.map(n => `<option value="${n.id}">${esc(n.titulo)}</option>`).join("")}</select>`;
  let h = `<div class="acciones"><button class="estrella ${b.importante?'on':''}" data-a="imp" title="Importante">★</button><div class="campo" style="flex:1"><input id="bTexto" value="${esc(b.texto)}" /></div></div>`;
  h += `<div class="campo"><label>¿Qué es esto?</label></div><div class="opciones">`;
  h += `<div class="op" data-a="paso"><b>→ paso</b> de ${activos.length ? sel(activos, "selPaso") : '<span class="aviso">(no hay cuadros activos)</span>'}</div>`;
  h += `<div class="op" data-a="cuadro"><b>→ cuadro</b> en ${sel(rs, "selRaiz")}</div>`;
  h += `<div class="op" data-a="calendario"><b>→ calendario</b> <input type="date" id="selFecha" value="${hoy()}" /></div>`;
  h += `<div class="op" data-a="nota"><b>→ nota</b> de ${sel(cuadros, "selNota")}</div>`;
  h += `<div class="op" data-a="algundia"><b>algún día</b> quizá, no ahora</div>`;
  h += `<div class="op" data-a="archivar"><b>archivar</b> hecho o descartado</div>`;
  if(b.estado !== "pendiente") h += `<div class="op" data-a="pendiente"><b>↩ bandeja</b> volver a pendiente</div>`;
  h += `<div class="op" data-a="borrar" style="color:var(--rojo)"><b>borrar</b> eliminar del todo</div></div>`;
  const c = $("#pCuerpo"); c.innerHTML = h;
  $("#bTexto").onchange = () => { b.texto = $("#bTexto").value.trim() || b.texto; guardar(); };
  c.querySelectorAll("select,input").forEach(x => x.onclick = (e) => e.stopPropagation());
  c.querySelectorAll("[data-a]").forEach(o => o.onclick = () => {
    const a = o.dataset.a; b.texto = $("#bTexto").value.trim() || b.texto;
    if(a === "imp"){ toggleImportante(id, true); abrirBandeja(id); return; }
    const arg = a==="paso" ? ($("#selPaso")||{}).value : a==="cuadro" ? $("#selRaiz").value : a==="calendario" ? $("#selFecha").value : a==="nota" ? $("#selNota").value : null;
    if((a==="paso"||a==="cuadro"||a==="nota"||a==="calendario") && !arg){ toast("Elige el destino"); return; }
    procesar(id, a, arg);
  });
}
function renderBandeja(){
  $("#tBandeja").textContent = texto("bandeja_t");
  const pint = (arr, vacio) => arr.length ? arr.map(b => `<div class="item ${b.importante?'imp':''}" data-b="${b.id}"><button class="estrella ${b.importante?'on':''}" data-imp="${b.id}">★</button><div class="tx">${esc(b.texto)}<div class="f">${b.fecha}${b.destino?' · '+esc(b.destino):''}</div></div></div>`).join("") : `<div class="aviso">${vacio}</div>`;
  const pend = datos.bandeja.filter(b => b.estado === "pendiente"), alg = datos.bandeja.filter(b => b.estado === "algundia"), arch = datos.bandeja.filter(b => b.estado === "archivado").slice(0,30);
  $("#bandejaLista").innerHTML = pint(pend, "Bandeja vacía. Bien.");
  $("#bandejaAlgunLista").innerHTML = pint(alg, "Nada aparcado."); $("#nAlgun").textContent = alg.length;
  $("#bandejaArchLista").innerHTML = pint(arch, "Nada archivado."); $("#nArch").textContent = datos.bandeja.filter(b => b.estado === "archivado").length;
  document.querySelectorAll("#vBandeja [data-b]").forEach(el => el.onclick = (e) => { if(e.target.closest("[data-imp]")) return; abrirBandeja(el.dataset.b); });
  document.querySelectorAll("#vBandeja [data-imp]").forEach(b => b.onclick = (e) => { e.stopPropagation(); toggleImportante(b.dataset.imp, true); });
}
/* ---------- atención: importante / vencido / próximo ---------- */
function atencion(){
  const h = hoy(); const lim = new Date(); lim.setDate(lim.getDate() + 7); const h7 = fechaStr(lim);
  const vivos = datos.nodos.filter(n => (n.tipo === "cuadro" || n.tipo === "paso") && n.estado !== "hecho");
  const imp = [...vivos.filter(n => n.importante).map(n => ({ t:n.titulo, s: ruta(n.padre).slice(-1)[0], nodo:n.id })), ...datos.bandeja.filter(b => b.importante && b.estado !== "archivado").map(b => ({ t:b.texto, s:"bandeja", band:b.id }))];
  const ven = vivos.filter(n => n.plazo && n.plazo < h).sort((a,b) => a.plazo.localeCompare(b.plazo)).map(n => ({ t:n.titulo, s:"venció " + n.plazo, nodo:n.id }));
  const pro = vivos.filter(n => n.plazo && n.plazo >= h && n.plazo <= h7).sort((a,b) => a.plazo.localeCompare(b.plazo)).map(n => ({ t:n.titulo, s:"vence " + n.plazo, nodo:n.id }));
  return { imp, ven, pro };
}
/* ---------- revisión semanal ---------- */
function renderRevision(){
  const el = $("#revision"); const h0 = hoy(); const d7 = new Date(); d7.setDate(d7.getDate()-7); const hace7 = fechaStr(d7); const d15 = new Date(); d15.setDate(d15.getDate()+15); const en15 = fechaStr(d15);
  const pend = datos.bandeja.filter(b => b.estado === "pendiente");
  const parados = datos.nodos.filter(n => n.tipo === "paso" && n.estado === "activo" && (n.tocado || n.activado || n.creado || "2000-01-01") < hace7);
  const vivos = datos.nodos.filter(n => (n.tipo === "cuadro" || n.tipo === "paso") && n.estado !== "hecho");
  const prox = vivos.filter(n => n.plazo && n.plazo <= en15).sort((a,b) => a.plazo.localeCompare(b.plazo));
  const alg = datos.bandeja.filter(b => b.estado === "algundia");
  const hechosSemana = datos.nodos.filter(n => n.cerrado && n.cerrado >= hace7);
  const item = (t, s, attr) => `<div class="paso" ${attr}><span class="t" style="flex:1">${esc(t)}</span><span class="n">${esc(s||"")}</span></div>`;
  let h = `<section><h2>1 · Bandeja <small>${pend.length} sin procesar</small></h2><div class="cuerpo">${pend.length ? pend.slice(0,10).map(b => item(b.texto, b.fecha, 'data-b="'+b.id+'"')).join("") + (pend.length>10?'<div class="aviso">…y '+(pend.length-10)+' más</div>':'') : '<div class="aviso">Vacía. Bien.</div>'}<div class="acciones"><button class="btn sec" data-ir="bandeja">Ir a la bandeja</button></div></div></section>`;
  h += `<section><h2>2 · Hecho esta semana <small>${hechosSemana.length}</small></h2><div class="cuerpo">${hechosSemana.length ? hechosSemana.map(n => item(n.titulo, n.cerrado, 'data-abrir="'+n.id+'"')).join("") : '<div class="aviso">Nada cerrado en 7 días.</div>'}</div></section>`;
  h += `<section><h2>3 · Pasos activos parados <small>sin tocar más de 7 días</small></h2><div class="cuerpo">${parados.length ? parados.map(n => item(n.titulo, "desde " + (n.tocado||n.activado||n.creado), 'data-abrir="'+n.id+'"')).join("") : '<div class="aviso">Todo lo activo se ha movido esta semana.</div>'}</div></section>`;
  h += `<section><h2>4 · Plazos en 15 días <small>${prox.length}</small></h2><div class="cuerpo">${prox.length ? prox.map(n => item(n.titulo, (n.plazo < h0 ? "VENCIÓ " : "") + n.plazo, 'data-abrir="'+n.id+'"')).join("") : '<div class="aviso">Nada vence en dos semanas.</div>'}</div></section>`;
  h += `<section><h2>5 · Algún día / quizá <small>${alg.length}</small></h2><div class="cuerpo">${alg.length ? alg.map(b => item(b.texto, b.fecha, 'data-b="'+b.id+'"')).join("") : '<div class="aviso">Nada aparcado.</div>'}</div></section>`;
  h += `<section><h2>6 · La línea de la semana</h2><div class="cuerpo"><div class="alta" style="display:flex;gap:6px"><input id="revTxt" placeholder="Qué ha pasado, qué toca, cómo vas…" style="flex:1;font:inherit;font-size:13px;padding:6px 8px;border:1.2px solid var(--linea);background:#fff" /><button class="btn" id="bRev">Cerrar revisión</button></div>`;
  h += (datos.revisiones||[]).slice(0,12).map(r => `<div class="nota"><div class="f">${r.fecha}</div>${esc(r.texto)}</div>`).join("") + `</div></section>`;
  el.innerHTML = h;
  el.querySelectorAll("[data-abrir]").forEach(x => x.onclick = () => { ir("arbol"); abrir(x.dataset.abrir); });
  el.querySelectorAll("[data-b]").forEach(x => x.onclick = () => abrirBandeja(x.dataset.b));
  $("#bRev").onclick = () => { const t = $("#revTxt").value.trim(); datos.revisiones.unshift({ fecha: hoy(), texto: t || "(sin texto)" }); datos.ultimaRevision = hoy(); guardar(); render(); toast("Revisión cerrada"); };
}
function editar(id, campo, valor){ const n=nodo(id); if(valor==="" ) delete n[campo]; else n[campo]=valor; n.tocado = hoy(); guardar(); }

/* ---------- vistas ---------- */
const VISTAS = { inicio:"vInicio", arbol:"vArbol", bandeja:"vBandeja", calendario:"vCalendario", revision:"vRevision" };
let vista = "inicio";
function ir(v, guardarEstado=true){
  if(!VISTAS[v]) v = "inicio";
  vista = v;
  document.querySelectorAll(".vista").forEach(el => el.classList.toggle("on", el.id === VISTAS[v]));
  if(guardarEstado) sessionStorage.setItem("raiz.vista", v);
  window.scrollTo(0,0);
  render();
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-ir]"); if(b) ir(b.dataset.ir); });
function activosHoy(){
  // el nodo activo más profundo de cada raíz
  const out = [];
  for(const r of raices()){
    let n = hijos(r.id).find(c => c.estado === "activo"); if(!n) continue;
    let p; while((p = hijos(n.id).find(c => c.estado === "activo"))) n = p;
    out.push({ raiz: r, nodo: n });
  }
  return out;
}
/* ---------- calendario ---------- */
let calMes = hoy().slice(0,7);   // "YYYY-MM"
let calDia = null;               // día seleccionado en la vista grande
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function fechaStr(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function marcasDelDia(f){
  const out = []; const h = hoy();
  for(const n of datos.nodos){
    if(n.tipo !== "cuadro" && n.tipo !== "paso") continue;
    if(n.inicio === f) out.push({ cls:"inicio", txt:"▶ " + n.titulo, nodo:n.id });
    if(n.plazo === f){ const cls = n.estado === "hecho" ? "hecho" : (f < h ? "vencido" : "plazo"); out.push({ cls, txt:"◆ " + n.titulo, nodo:n.id }); }
    if(n.cerrado === f && n.plazo !== f) out.push({ cls:"hecho", txt:"✓ " + n.titulo, nodo:n.id });
  }
  for(const e of (datos.eventos||[])) if(e.fecha === f) out.push({ cls:"evento", txt:e.texto, evento:e.id, nodo:e.nodo });
  return out;
}
function renderCal(mes, mini){
  const [y,m] = mes.split("-").map(Number);
  const primero = new Date(y, m-1, 1); const dow = (primero.getDay()+6)%7; // lunes=0
  const inicio = new Date(y, m-1, 1 - dow);
  const h0 = hoy();
  let h = `<div class="cal ${mini?'mini':''}" ${mini?'data-ir="calendario"':''}><div class="cab"><div><span class="num">03 · CALENDARIO</span><h3 style="display:inline">${MESES[m-1]} ${y}</h3></div>`;
  h += mini ? `<span class="num">pulsa para abrir</span>` : `<div><button class="btn sec" data-cal="-1">◀</button> <button class="btn sec" data-cal="0">Hoy</button> <button class="btn sec" data-cal="1">▶</button></div>`;
  h += `</div><div class="dias">` + ["lu","ma","mi","ju","vi","sá","do"].map(d=>`<div class="dn">${d}</div>`).join("");
  const semanas = mini ? 6 : 6;
  for(let i=0;i<semanas*7;i++){
    const d = new Date(inicio); d.setDate(inicio.getDate()+i); const f = fechaStr(d);
    if(mini && i >= 35 && d.getMonth() !== m-1) break;
    const fuera = d.getMonth() !== m-1;
    const ms = marcasDelDia(f); const max = mini ? 2 : 4;
    h += `<div class="d ${fuera?'fuera':''} ${f===h0?'hoy':''} ${f===calDia&&!mini?'sel':''}" data-dia="${f}"><span class="n">${d.getDate()}</span>`;
    h += ms.slice(0,max).map(x => `<span class="marca ${x.cls}" title="${esc(x.txt)}">${esc(x.txt)}</span>`).join("");
    if(ms.length > max) h += `<span class="marca">+${ms.length-max}</span>`;
    h += `</div>`;
  }
  h += `</div><div class="leyenda"><span class="lp">plazo</span><span class="lv">vencido</span><span class="lh">hecho</span><span class="li">inicio</span><span class="le">anotación</span></div></div>`;
  return h;
}
function renderCalendario(){
  const el = $("#calGrande"); if(!datos){ el.innerHTML = '<div class="aviso">Sin datos.</div>'; return; }
  el.innerHTML = renderCal(calMes, false);
  el.querySelectorAll("[data-cal]").forEach(b => b.onclick = () => { const k = +b.dataset.cal; if(k===0){ calMes = hoy().slice(0,7); } else { const [y,m] = calMes.split("-").map(Number); const d = new Date(y, m-1+k, 1); calMes = fechaStr(d).slice(0,7); } renderCalendario(); });
  el.querySelectorAll("[data-dia]").forEach(d => d.onclick = () => { calDia = d.dataset.dia; abrirDia(calDia); renderCalendario(); });
}
function abrirDia(f){
  selId = null;
  $("#panel").classList.add("open"); $("#velo").classList.add("open");
  const d = new Date(f + "T00:00:00");
  $("#pRuta").textContent = "calendario";
  $("#pTitulo").textContent = ["lunes","martes","miércoles","jueves","viernes","sábado","domingo"][(d.getDay()+6)%7] + " " + d.getDate() + " de " + MESES[d.getMonth()] + " de " + d.getFullYear();
  const ms = marcasDelDia(f);
  let h = `<div class="lista">` + (ms.length ? ms.map(x => `<div class="paso" ${x.nodo?('data-abrir="'+x.nodo+'"'):''}><span class="marca ${x.cls}" style="white-space:normal;flex:1">${esc(x.txt)}</span>${x.evento?('<span class="mini"><button data-xe="'+x.evento+'" title="Borrar anotación">✕</button></span>'):''}</div>`).join("") : '<div class="aviso">Nada ese día.</div>') + `</div>`;
  const activos = datos.nodos.filter(n => (n.tipo==="cuadro"||n.tipo==="paso") && n.estado !== "hecho");
  h += `<div class="campo"><label>Anotar en este día</label><input id="evTxt" placeholder="Reunión, visita, entrega…" /></div>`;
  h += `<div class="campo"><label>Vincular a un cuadro (opcional)</label><select id="evNodo" style="width:100%;font:inherit;font-size:13px;padding:6px 8px;border:1.2px solid var(--linea);background:#fff"><option value="">—</option>${activos.map(n=>`<option value="${n.id}">${esc(n.titulo)}</option>`).join("")}</select></div>`;
  h += `<div class="acciones"><button class="btn" id="bEv">Anotar</button></div>`;
  const c = $("#pCuerpo"); c.innerHTML = h;
  $("#bEv").onclick = () => { const t = $("#evTxt").value.trim(); if(!t) return; (datos.eventos = datos.eventos || []).push({ id: "ev" + Date.now().toString(36), fecha: f, texto: t, nodo: $("#evNodo").value || undefined }); guardar(); abrirDia(f); renderCalendario(); };
  $("#evTxt").addEventListener("keydown", e => { if(e.key==="Enter") $("#bEv").click(); });
  c.querySelectorAll("[data-xe]").forEach(b => b.onclick = (e) => { e.stopPropagation(); datos.eventos = (datos.eventos||[]).filter(x => x.id !== b.dataset.xe); guardar(); abrirDia(f); renderCalendario(); });
  c.querySelectorAll("[data-abrir]").forEach(p => p.onclick = (e) => { if(e.target.closest(".mini")) return; ir("arbol"); abrir(p.dataset.abrir); });
}
function renderInicio(){
  const el = $("#indice"); if(!datos){ el.innerHTML = '<div class="aviso">Sin datos. Entra en El árbol y vincula raiz.json o conecta Dropbox.</div>'; return; }
  const act = activosHoy();
  const total = datos.nodos.filter(n => n.tipo === "cuadro").length, hechos = datos.nodos.filter(n => n.tipo === "cuadro" && n.estado === "hecho").length;
  datos.bandeja = datos.bandeja || []; const pend = datos.bandeja.filter(b => b.estado === "pendiente").length;
  const at = atencion();
  const obj = nodo("arbol");
  let h = `<div class="lamina ahora"><div class="num">00 · AHORA</div><h3 id="edAhora">${esc(texto("ahora"))}</h3>`;
  h += act.length ? `<div class="ahoraLista">` + act.map(a => `<div class="ahoraItem" data-abrirnodo="${a.nodo.id}"><div class="r">${esc(a.raiz.titulo)}</div><div class="t">${esc(a.nodo.titulo)}</div>${a.nodo.hecho_cuando?'<div class="h">hecho cuando: '+esc(a.nodo.hecho_cuando)+'</div>':''}</div>`).join("") + `</div>`
                   : `<p>Nada activo. Entra en el árbol y activa un cuadro.</p>`;
  h += `</div>`;
  const col = (cls, tit, arr, vacio) => `<div class="${cls}"><h4><span>${tit}</span><span>${arr.length||''}</span></h4>${arr.length ? arr.slice(0,6).map(x => `<div class="it" ${x.nodo?'data-abrirnodo="'+x.nodo+'"':''} ${x.band?'data-abrirband="'+x.band+'"':''}>${esc(x.t)}<small>${esc(x.s||'')}</small></div>`).join("") + (arr.length>6?'<div class="nada">+'+(arr.length-6)+' más</div>':'') : '<div class="nada">'+vacio+'</div>'}</div>`;
  h += `<div class="atencion">${col("imp","★ Importante",at.imp,"nada marcado")}${col("ven","Vencido",at.ven,"nada vencido")}${col("pro","Próximos 7 días",at.pro,"nada esta semana")}</div>`;
  h += `<div class="lamina" data-ir="arbol"><div class="num">01</div><h3 id="edArbolT">${esc(texto("arbol_t"))}</h3><p id="edArbolD">${esc(texto("arbol_d"))}</p><div class="pie">${hechos}/${total} cuadros hechos · ${act.length} activo${act.length===1?'':'s'}</div></div>`;
  h += `<div class="lamina" data-ir="bandeja"><div class="num">02</div><h3 id="edBandejaT">${esc(texto("bandeja_t"))}</h3><p id="edBandejaD">${esc(texto("bandeja_d"))}</p><div class="pie">${pend ? pend + ' sin procesar' : 'vacía'}</div></div>`;
  h += `<div class="lamina" data-ir="revision"><div class="num">04</div><h3 id="edRevT">${esc(texto("revision_t"))}</h3><p id="edRevD">${esc(texto("revision_d"))}</p><div class="pie">${datos.ultimaRevision ? 'última: ' + datos.ultimaRevision : 'ninguna todavía'}</div></div>`;
  el.innerHTML = h;
  const calEl = document.createElement("div"); calEl.style.gridColumn = "1/-1"; calEl.innerHTML = renderCal(hoy().slice(0,7), true); el.appendChild(calEl);
  calEl.querySelector(".cal").onclick = () => { calMes = hoy().slice(0,7); ir("calendario"); };
  el.querySelectorAll("[data-abrirnodo]").forEach(x => x.onclick = (e) => { e.stopPropagation(); ir("arbol"); abrir(x.dataset.abrirnodo); });
  el.querySelectorAll("[data-abrirband]").forEach(x => x.onclick = (e) => { e.stopPropagation(); ir("bandeja"); abrirBandeja(x.dataset.abrirband); });
  // textos editables de la portada
  editable($("#titulo"), datos.titulo || "La raíz", v => { datos.titulo = v || "La raíz"; guardar(); render(); });
  editable($("#lema"), datos.lema || "", v => { datos.lema = v; guardar(); render(); });
  editable($("#edAhora"), texto("ahora"), v => setTexto("ahora", v));
  editable($("#edArbolT"), texto("arbol_t"), v => setTexto("arbol_t", v)); editable($("#edArbolD"), texto("arbol_d"), v => setTexto("arbol_d", v));
  editable($("#edBandejaT"), texto("bandeja_t"), v => setTexto("bandeja_t", v)); editable($("#edBandejaD"), texto("bandeja_d"), v => setTexto("bandeja_d", v));
  editable($("#edRevT"), texto("revision_t"), v => setTexto("revision_t", v)); editable($("#edRevD"), texto("revision_d"), v => setTexto("revision_d", v));
}

/* ---------- render ---------- */
function render(){
  if(datos){ ["#titulo","#lema"].forEach(q => { const e = $(q); e.classList.remove("ed"); e.onclick = null; }); $("#titulo").textContent = datos.titulo || "La raíz"; $("#lema").textContent = datos.lema || ""; $("#txtActualizado").textContent = "act. " + (datos.actualizado || "").replace("T"," ").slice(0,16); }
  if(vista === "inicio"){ renderInicio(); return; }
  if(vista === "calendario"){ renderCalendario(); return; }
  if(vista === "bandeja"){ renderBandeja(); return; }
  if(vista === "revision"){ renderRevision(); return; }
  if(!datos){ $("#arbol").innerHTML = '<div class="aviso">Sin datos. Vincula raiz.json o conecta Dropbox.</div>'; return; }
  $("#titulo").textContent = datos.titulo || "La raíz";
  $("#lema").textContent = datos.lema || "";
  $("#txtActualizado").textContent = "act. " + (datos.actualizado || "").replace("T"," ").slice(0,16);
  const arbol = $("#arbol");
  const obj = nodo("arbol"), tronco = nodo("tronco");
  let h = '<div class="objetivo">';
  if(obj) h += `<div class="copa">${esc(obj.titulo)}</div>`;
  if(tronco) h += `<div class="tronco">${esc(tronco.titulo)}</div>`;
  h += '</div>';
  h += '<div class="tablero" id="tablero">';
  for(const r of raices()){
    const cs = hijos(r.id);
    const hechos = cs.filter(c=>c.estado==="hecho").length;
    h += `<section class="raiz" data-raiz="${r.id}"><h2 draggable="true" data-asa="${r.id}"><span class="asa" title="Arrastra para mover la columna">⋮⋮</span><span class="titulo-raiz" data-ren="${r.id}" title="Clic para renombrar">${esc(r.titulo)}</span><small>${hechos}/${cs.length}</small><button class="mas" data-menu="${r.id}" title="Menú">···</button></h2><div class="cuadros" data-lista="${r.id}">`;
    for(const c of cs){
      const nh = hijos(c.id);
      h += `<div class="cuadro ${c.estado} ${c.id===selId?'sel':''}" draggable="true" data-id="${c.id}">
        <div class="t">${c.importante?'<span style="color:#C9A227">★</span> ':''}${esc(c.titulo)}</div>
        <div class="m">${c.plazo?('<span>▸ '+c.plazo+'</span>'):''}${c.estado==='activo'&&nh.length?('<span>'+nh.filter(x=>x.estado==='hecho').length+'/'+nh.length+' pasos</span>'):''}</div>
        ${c.notas&&c.notas.length?'<div class="hijos">✎'+c.notas.length+'</div>':''}
      </div>`;
    }
    h += `<button class="btn sec" data-nuevo="${r.id}">+ cuadro</button></div></section>`;
  }
  h += `<button class="nuevaRaiz" id="bNuevaRaiz">+ raíz</button></div>`;
  arbol.innerHTML = h;
  arbol.querySelectorAll(".cuadro").forEach(el => el.onclick = () => abrir(el.dataset.id));
  arbol.querySelectorAll("[data-nuevo]").forEach(el => el.onclick = () => { const t = prompt("Título del nuevo cuadro"); if(t) nuevoHijo(el.dataset.nuevo, t); });
  const bNR = $("#bNuevaRaiz"); if(bNR) bNR.onclick = () => { const t = prompt("Nombre de la nueva raíz"); if(t) nuevaRaiz(t.trim()); };
  // renombrar raíz con clic en el título
  arbol.querySelectorAll("[data-ren]").forEach(el => el.onclick = (e) => {
    e.stopPropagation(); const id = el.dataset.ren; const inp = document.createElement("input"); inp.value = nodo(id).titulo;
    el.replaceWith(inp); inp.focus(); inp.select();
    let fin = false; const ok = () => { if(fin) return; fin = true; renombrar(id, inp.value.trim()); };
    inp.onblur = ok; inp.onkeydown = (ev) => { if(ev.key==="Enter") ok(); if(ev.key==="Escape"){ fin = true; render(); } };
  });
  // menú de raíz
  arbol.querySelectorAll("[data-menu]").forEach(b => b.onclick = (e) => { e.stopPropagation(); menuRaiz(b.dataset.menu, b); });
  instalarArrastre(arbol);
  const copa = arbol.querySelector(".copa"); if(copa && obj) editable(copa, obj.titulo, v => { if(v){ obj.titulo = v; guardar(); } render(); });
  if(selId) renderPanel();
}
function abrir(id){ selId = id; $("#panel").classList.add("open"); $("#velo").classList.add("open"); render(); }
function cerrar(){ selId = null; calDia = null; $("#panel").classList.remove("open"); $("#velo").classList.remove("open"); render(); }
function renderPanel(){
  const n = nodo(selId); if(!n){ cerrar(); return; }
  $("#pRuta").textContent = ruta(n.padre).join(" › ") + "  ·  " + n.id;
  $("#pTitulo").textContent = n.titulo;
  const hs = hijos(n.id);
  const puedeActivar = n.estado === "disponible";
  let h = `<div><button class="estrella ${n.importante?'on':''}" data-a="imp" title="Importante">★</button> <span class="chip ${n.estado}">${n.estado}</span> ${n.plazo?'<span class="chip">plazo '+n.plazo+'</span>':''} ${n.cerrado?'<span class="chip hecho">hecho '+n.cerrado+'</span>':''}</div>`;
  h += `<div class="acciones">
    ${puedeActivar?'<button class="btn act" data-a="activar">Activar</button>':''}
    ${n.estado==='activo'?'<button class="btn act" data-a="hecho">Marcar hecho</button>':''}
    ${n.estado==='hecho'?'<button class="btn sec" data-a="reabrir">Reabrir</button>':''}
    <button class="btn sec" data-a="subir" title="Subir">▲</button>
    <button class="btn sec" data-a="bajar" title="Bajar">▼</button>
    <button class="btn sec" data-a="eliminar" style="margin-left:auto;color:var(--rojo);border-color:var(--rojo)">Eliminar</button>
  </div>`;
  h += `<div class="campo"><label>Título</label><input data-e="titulo" value="${esc(n.titulo)}" /></div>`;
  h += `<div class="campo"><label>Hecho cuando…</label><input data-e="hecho_cuando" value="${esc(n.hecho_cuando||'')}" placeholder="Criterio verificable" /></div>`;
  h += `<div class="acciones" style="gap:10px"><div class="campo" style="flex:1"><label>Inicio</label><input data-e="inicio" type="date" value="${n.inicio||''}" /></div><div class="campo" style="flex:1"><label>Plazo</label><input data-e="plazo" type="date" value="${n.plazo||''}" /></div></div>`;
  // pasos
  h += `<div><div class="campo"><label>${n.tipo==='raiz'?'Cuadros':'Pasos'} (${hs.filter(x=>x.estado==='hecho').length}/${hs.length})</label></div><div class="lista">`;
  hs.forEach((p,i) => { h += `<div class="paso ${p.estado}" data-abrir="${p.id}"><span class="n">${String(i+1).padStart(2,'0')}</span><span class="t" style="flex:1">${esc(p.titulo)}</span>
    <span class="mini"><button data-m="${p.id}|-1" title="Subir">▲</button><button data-m="${p.id}|1" title="Bajar">▼</button><button data-x="${p.id}" title="Eliminar">✕</button></span></div>`; });
  h += `</div>`;
  if(n.estado === "activo") h += `<div class="acciones" style="margin-top:6px"><input id="nuevoPaso" placeholder="Nuevo paso…" style="flex:1;font:inherit;font-size:13px;padding:6px 8px;border:1.2px solid var(--linea)" /><button class="btn" data-a="nuevoPaso">+ paso</button></div>`;
  else h += `<div class="aviso">Solo un nodo activo se desglosa.</div>`;
  h += `</div>`;
  // notas
  h += `<div><div class="campo"><label>Notas</label><textarea id="nuevaNota" placeholder="Apunta y pulsa Guardar nota"></textarea></div><div class="acciones"><button class="btn" data-a="nota">Guardar nota</button></div><div class="lista" style="margin-top:8px">`;
  h += (n.notas||[]).map(x => `<div class="nota"><div class="f">${x.fecha}</div>${esc(x.texto)}</div>`).join("");
  h += `</div></div>`;
  const c = $("#pCuerpo"); c.innerHTML = h;
  c.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if(a==="imp"){ toggleImportante(n.id, false); return; }
    if(a==="activar") activar(n.id);
    if(a==="hecho") marcarHecho(n.id);
    if(a==="reabrir") reabrir(n.id);
    if(a==="subir") mover(n.id, -1);
    if(a==="bajar") mover(n.id, 1);
    if(a==="eliminar") eliminar(n.id);
    if(a==="nota"){ const t=$("#nuevaNota").value.trim(); if(t) addNota(n.id, t); }
    if(a==="nuevoPaso"){ const t=$("#nuevoPaso").value.trim(); if(t) nuevoHijo(n.id, t); }
  });
  c.querySelectorAll("[data-e]").forEach(i => i.onchange = () => { editar(n.id, i.dataset.e, i.value.trim()); render(); });
  c.querySelectorAll("[data-abrir]").forEach(p => p.onclick = (e) => { if(e.target.closest(".mini")) return; abrir(p.dataset.abrir); });
  c.querySelectorAll("[data-m]").forEach(b => b.onclick = (e) => { e.stopPropagation(); const [id,d] = b.dataset.m.split("|"); mover(id, +d); });
  c.querySelectorAll("[data-x]").forEach(b => b.onclick = (e) => { e.stopPropagation(); eliminar(b.dataset.x); });
}
function menuRaiz(id, ancla){
  document.querySelectorAll(".menuRaiz").forEach(m => m.remove());
  const r = nodo(id); const rs = raices(); const i = rs.findIndex(x => x.id === id);
  const m = document.createElement("div"); m.className = "menuRaiz";
  m.innerHTML = `<button data-o="ren">Renombrar</button><button data-o="izq" ${i===0?'disabled':''}>◀ Mover a la izquierda</button><button data-o="der" ${i===rs.length-1?'disabled':''}>Mover a la derecha ▶</button><button data-o="del" class="rojo">Eliminar raíz…</button>`;
  const rect = ancla.getBoundingClientRect(); m.style.left = Math.min(rect.left, window.innerWidth - 200) + "px"; m.style.top = (rect.bottom + window.scrollY + 4) + "px";
  document.body.appendChild(m);
  m.querySelectorAll("button").forEach(b => b.onclick = () => {
    const o = b.dataset.o; m.remove();
    if(o==="ren"){ const t = prompt("Nuevo nombre", r.titulo); if(t) renombrar(id, t.trim()); }
    if(o==="izq") mover(id, -1);
    if(o==="der") mover(id, 1);
    if(o==="del") eliminar(id);
  });
  setTimeout(() => document.addEventListener("click", () => m.remove(), { once:true }), 0);
}
function instalarArrastre(arbol){
  let dragId = null, dragTipo = null;
  // tarjetas
  arbol.querySelectorAll(".cuadro[draggable]").forEach(el => {
    el.addEventListener("dragstart", (e) => { dragId = el.dataset.id; dragTipo = "cuadro"; el.classList.add("arrastrando"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId); });
    el.addEventListener("dragend", () => { dragId = null; dragTipo = null; limpiar(); });
    el.addEventListener("dragover", (e) => { if(dragTipo !== "cuadro" || dragId === el.dataset.id) return; e.preventDefault(); const mitad = e.clientY < el.getBoundingClientRect().top + el.offsetHeight/2; el.classList.toggle("sobre-antes", mitad); el.classList.toggle("sobre-despues", !mitad); });
    el.addEventListener("dragleave", () => el.classList.remove("sobre-antes","sobre-despues"));
    el.addEventListener("drop", (e) => { if(dragTipo !== "cuadro") return; e.preventDefault(); e.stopPropagation();
      const destino = nodo(el.dataset.id); const hs = hijos(destino.padre).filter(h => h.id !== dragId); let idx = hs.findIndex(h => h.id === destino.id);
      if(!el.classList.contains("sobre-antes")) idx += 1; limpiar(); moverA(dragId, destino.padre, idx); });
  });
  // listas (soltar al final de la columna)
  arbol.querySelectorAll(".cuadros[data-lista]").forEach(el => {
    el.addEventListener("dragover", (e) => { if(dragTipo !== "cuadro") return; e.preventDefault(); el.classList.add("sobre"); });
    el.addEventListener("dragleave", (e) => { if(!el.contains(e.relatedTarget)) el.classList.remove("sobre"); });
    el.addEventListener("drop", (e) => { if(dragTipo !== "cuadro") return; e.preventDefault(); limpiar(); moverA(dragId, el.dataset.lista, 999); });
  });
  // columnas (asa en la cabecera)
  arbol.querySelectorAll("h2[data-asa]").forEach(h2 => {
    const col = h2.closest(".raiz");
    h2.addEventListener("dragstart", (e) => { if(e.target.tagName === "INPUT"){ e.preventDefault(); return; } dragId = h2.dataset.asa; dragTipo = "raiz"; col.classList.add("arrastrando"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId); });
    h2.addEventListener("dragend", () => { dragId = null; dragTipo = null; limpiar(); });
    col.addEventListener("dragover", (e) => { if(dragTipo !== "raiz" || dragId === col.dataset.raiz) return; e.preventDefault(); col.classList.add("sobre"); });
    col.addEventListener("dragleave", (e) => { if(!col.contains(e.relatedTarget)) col.classList.remove("sobre"); });
    col.addEventListener("drop", (e) => { if(dragTipo !== "raiz") return; e.preventDefault(); e.stopPropagation();
      const rs = raices().filter(r => r.id !== dragId); let idx = rs.findIndex(r => r.id === col.dataset.raiz);
      if(e.clientX > col.getBoundingClientRect().left + col.offsetWidth/2) idx += 1; limpiar(); moverA(dragId, "arbol", idx); });
  });
  function limpiar(){ arbol.querySelectorAll(".arrastrando,.sobre,.sobre-antes,.sobre-despues").forEach(x => x.classList.remove("arrastrando","sobre","sobre-antes","sobre-despues")); }
}
function esc(s){ return String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- persistencia ---------- */
function serializar(){ datos.actualizado = ahora().slice(0,19) + "+01:00"; return JSON.stringify(datos, null, 2); }
function guardar(){
  const txt = serializar();
  localStorage.setItem(LS_DATOS, txt);
  clearTimeout(guardarTimer);
  guardarTimer = setTimeout(async () => {
    try{
      if(modo === "dropbox"){ setEstado("sync","subiendo…"); await dbxSubir(txt); setEstado("ok","Dropbox"); }
      else if(modo === "archivo" && fileHandle){ const w = await fileHandle.createWritable(); await w.write(txt); await w.close(); setEstado("ok","raiz.json local"); }
      else setEstado("", "solo en este navegador");
    }catch(e){ console.error(e); setEstado("err","error al guardar"); toast("No se pudo guardar: " + e.message); }
  }, 600);
}
async function cargarInicial(){
  // 1) Dropbox si hay token; 2) copia en localStorage; 3) ../raiz.json servido en local
  if(CFG.appKey && localStorage.getItem(LS_RT)){
    try{ modo="dropbox"; setEstado("sync","leyendo Dropbox…"); datos = JSON.parse(await dbxBajar()); setEstado("ok","Dropbox"); localStorage.setItem(LS_DATOS, JSON.stringify(datos)); return; }
    catch(e){ console.error(e); setEstado("err","Dropbox: " + e.message); }
  }
  const ls = localStorage.getItem(LS_DATOS);
  if(ls){ datos = JSON.parse(ls); modo = fileHandle ? "archivo" : "local"; setEstado("", "copia local"); return; }
  try{ const r = await fetch("../raiz.json", {cache:"no-store"}); if(r.ok){ datos = await r.json(); localStorage.setItem(LS_DATOS, JSON.stringify(datos)); setEstado("", "leído ../raiz.json (solo lectura)"); return; } }catch(e){}
  setEstado("err","sin datos");
}
async function vincularArchivo(){
  if(!window.showOpenFilePicker){ toast("Tu navegador no permite escribir archivos; usa Chrome/Edge o Dropbox"); return; }
  try{
    const [h] = await window.showOpenFilePicker({ types:[{description:"raiz.json", accept:{"application/json":[".json"]}}] });
    fileHandle = h; const f = await h.getFile(); datos = JSON.parse(await f.text());
    modo = "archivo"; localStorage.setItem(LS_DATOS, JSON.stringify(datos)); setEstado("ok","raiz.json local"); $("#txtArchivo").textContent = f.name; render();
  }catch(e){ if(e.name!=="AbortError") toast(e.message); }
}
function descargar(){ const b = new Blob([serializar()],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="raiz.json"; a.click(); }

/* ---------- Dropbox (OAuth PKCE, sin secreto) ---------- */
function b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function sha256(s){ return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); }
function redirectUri(){ return location.origin + location.pathname; }
async function dbxConectar(){
  if(!CFG.appKey){ toast("Falta appKey en config.js"); return; }
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  localStorage.setItem(LS_VERIF, verifier);
  const challenge = b64url(await sha256(verifier));
  const u = new URL("https://www.dropbox.com/oauth2/authorize");
  u.search = new URLSearchParams({ client_id: CFG.appKey, response_type:"code", code_challenge: challenge, code_challenge_method:"S256", token_access_type:"offline", redirect_uri: redirectUri() }).toString();
  location.href = u.toString();
}
async function dbxCanjearCodigo(code){
  const verifier = localStorage.getItem(LS_VERIF);
  const r = await fetch("https://api.dropboxapi.com/oauth2/token", { method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body: new URLSearchParams({ code, grant_type:"authorization_code", client_id: CFG.appKey, code_verifier: verifier, redirect_uri: redirectUri() }) });
  const j = await r.json(); if(!r.ok) throw new Error(j.error_description || JSON.stringify(j));
  localStorage.setItem(LS_RT, j.refresh_token); localStorage.removeItem(LS_VERIF);
}
let accessToken = null, accessExp = 0;
async function dbxToken(){
  if(accessToken && Date.now() < accessExp - 60000) return accessToken;
  const r = await fetch("https://api.dropboxapi.com/oauth2/token", { method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body: new URLSearchParams({ grant_type:"refresh_token", refresh_token: localStorage.getItem(LS_RT), client_id: CFG.appKey }) });
  const j = await r.json(); if(!r.ok){ if(j.error==="invalid_grant") localStorage.removeItem(LS_RT); throw new Error(j.error_description || j.error); }
  accessToken = j.access_token; accessExp = Date.now() + (j.expires_in||14400)*1000; return accessToken;
}
async function dbxBajar(){
  const t = await dbxToken();
  const r = await fetch("https://content.dropboxapi.com/2/files/download", { method:"POST", headers:{ Authorization:"Bearer "+t, "Dropbox-API-Arg": JSON.stringify({ path: RUTA_DROPBOX }) } });
  if(!r.ok) throw new Error("descarga " + r.status + " " + (await r.text()).slice(0,120));
  return r.text();
}
async function dbxSubir(txt){
  const t = await dbxToken();
  const r = await fetch("https://content.dropboxapi.com/2/files/upload", { method:"POST", headers:{ Authorization:"Bearer "+t, "Content-Type":"application/octet-stream", "Dropbox-API-Arg": JSON.stringify({ path: RUTA_DROPBOX, mode:"overwrite", mute:true }) }, body: txt });
  if(!r.ok) throw new Error("subida " + r.status + " " + (await r.text()).slice(0,120));
}

/* ---------- arranque ---------- */
$("#bArchivo").onclick = vincularArchivo;
$("#bDropbox").onclick = () => { if(localStorage.getItem(LS_RT)){ if(confirm("¿Desconectar Dropbox en este dispositivo?")){ localStorage.removeItem(LS_RT); location.reload(); } } else dbxConectar(); };
$("#bRecargar").onclick = async () => { localStorage.removeItem(LS_DATOS); await cargarInicial(); if(datos) migrar(); render(); };
$("#bDescargar").onclick = descargar;
$("#bCerrar").onclick = cerrar; $("#velo").onclick = cerrar;
$("#bCapturar").onclick = () => { const t=$("#bandejaTxt").value.trim(); if(t){ capturar(t); $("#bandejaTxt").value=""; } };
$("#bandejaTxt").addEventListener("keydown", e => { if(e.key==="Enter") $("#bCapturar").click(); });

(async () => {
  const q = new URLSearchParams(location.search);
  if(q.get("code")){ try{ await dbxCanjearCodigo(q.get("code")); toast("Dropbox conectado"); }catch(e){ alert("Error al conectar Dropbox: " + e.message); } history.replaceState(null,"",location.pathname); }
  await cargarInicial();
  if(datos) migrar();
  ir(sessionStorage.getItem("raiz.vista") || "inicio", false);
  $("#bDropbox").textContent = localStorage.getItem(LS_RT) ? "Dropbox conectado" : "Conectar Dropbox";
  $("#avisoModo").textContent = CFG.appKey ? "" : "Sin appKey en config.js: la app guarda en este navegador y, si la vinculas, en raiz.json.";
  render();
  if("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).catch(()=>{});
})();
